name: Test

on: push

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    if: false
    strategy:
      matrix:
        py: ["3.10"]
        pylint: ["==3.3.9"]
        go: ["1.24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
      - name: Install pylint
        run: pip install --user pylint${{ matrix.pylint }}
      - name: pylint
        run: |
          pylint adapters/python/martian_shell.py
          pylint adapters/python/martian.py
          pylint test/martian_test.py
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-node@v6
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            web/martian/yarn.lock
            tools/syntax/vscode/yarn.lock
      - name: make all
        run: make all tarball
      - name: darwin build
        run: GOOS=darwin go build ./cmd/...
      - name: windows build
        run: |
          GOOS=windows GOARCH=amd64 go build ./cmd/...
          GOOS=windows GOARCH=amd64 go test -c ./martian/core -o "$RUNNER_TEMP/core_windows.test.exe"
          GOOS=windows GOARCH=amd64 go test -c ./cmd/mrjob -o "$RUNNER_TEMP/mrjob_windows.test.exe"
      - name: Integration tests
        run: make longtests

  macos:
    runs-on: macos-14
    if: false
    env:
      USE_BAZEL_VERSION: 7.5.0
    strategy:
      matrix:
        go: ["1.24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Darwin build and unit tests
        run: make test-darwin
      - name: Darwin runtime smoke tests
        run: make longtests
      - name: Install Bazelisk
        run: GOBIN="$RUNNER_TEMP/martian-tools" go install github.com/bazelbuild/bazelisk@v1.29.0
      - name: Darwin Bazel backend tests
        run: |
          "$RUNNER_TEMP/martian-tools/bazelisk" test --verbose_failures \
                                                     --enable_workspace \
                                                     //martian/core:core_test \
                                                     //cmd/mrjob:mrjob_test

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        go: ["1.24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Windows build
        run: go build ./cmd/...
      - name: Windows backend unit tests
        run: |
          go test ./cmd/mrjob -run 'TestWindows|TestWindowsSigToErrPreservesNativeError'
          go test ./martian/adapter -run 'TestWindows'
          go test ./martian/core -run 'TestWindows|TestObservedMemoryWindowsFields|TestNewResourceSampler|TestPathIsInsideDir'
          go test ./martian/util -run 'TestParseMroPath|TestFormatMroPath|TestSearchPaths|TestFindUniquePath|TestWindowsParseMroPathPreservesDriveLetters'
          python adapters/python/martian_shell_test.py
      - name: Windows mrjob-backed Python adapter smoke
        run: |
          go build -o "$env:RUNNER_TEMP\mrjob.exe" ./cmd/mrjob
          $env:MRO_TEST_MRJOB = "$env:RUNNER_TEMP\mrjob.exe"
          go test ./martian/core -run 'TestPipestancePythonAdapterSmoke' -count=1

  bazel:
    runs-on: ubuntu-latest
    if: false
    env:
      USE_BAZEL_VERSION: 7.5.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-go@v6
        id: setup_go
        with:
          go-version: "1.24"
      - name: Show bazel variables
        run: |
          bazel info
          echo "bazel_repository_cache=$(bazel info repository_cache)" >> $GITHUB_ENV
          echo "bazel_output_base=$(bazel info output_base)" >> $GITHUB_ENV
      - name: Cache bazel build of external repositories
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.bazel_output_base }}/external
          key: bazel-build-cache-${{steps.setup_go.outputs.go-version}}-${{hashFiles('deps.bzl', 'WORKSPACE')}}
          restore-keys: |
            bazel-build-cache-${{steps.setup_go.outputs.go-version}}
      - name: Cache bazel external repositories
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.bazel_repository_cache }}
          key: bazel-repo-cache-${{hashFiles('deps.bzl', 'WORKSPACE', 'web/martian/yarn.lock')}}
          restore-keys: |
            bazel-repo-cache-
      - name: test
        run: |
          bazel test --nobuild_tests_only \
                     --verbose_failures \
                     --discard_analysis_cache \
                     --notrack_incremental_state \
                     --nokeep_state_after_build \
                     --enable_workspace \
                     //...
      - name: Show build timing summary
        run: bazel analyze-profile ${{ env.bazel_output_base }}/command.profile.gz
